# Sert les fichiers statiques du portfolio.
# La compression et le TLS sont gérés en amont par Caddy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|jpg|jpeg|png|svg|pdf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
