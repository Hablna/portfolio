# Sert les fichiers statiques du portfolio.
# La compression et le TLS sont gérés en amont par Caddy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML, CSS, JS, JSON, PDF : le navigateur garde sa copie mais redemande
    # au serveur à chaque chargement (ETag → 304 si rien n'a changé).
    # Les noms de fichiers ne sont pas versionnés : un cache long ferait
    # cohabiter l'ancien JS/CSS avec le nouveau HTML après un déploiement.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Images et polices : changent rarement, cache d'un jour.
    location ~* \.(jpe?g|png|gif|svg|ico|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
