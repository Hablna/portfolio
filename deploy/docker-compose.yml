# Stack du portfolio habl.me — indépendante du reverse-proxy et des autres sites.
# À déposer dans /opt/habl.me/ sur le VPS.
services:
  web:
    image: nginx:1.27-alpine
    container_name: habl_portfolio
    restart: unless-stopped
    volumes:
      - /var/www/habl.me:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

networks:
  web:
    external: true
